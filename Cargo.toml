[package]
name = "smoking-sbdf"
version = "0.1.7"
edition = "2021"
description = "Rust core for streaming Spotfire SBDF and Parquet conversion"
license = "BSD-3-Clause"
readme = "README.md"
repository = "https://github.com/SMOKE-19/smoking-sbdf"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[features]
extension-module = ["pyo3/extension-module"]
planned-offset-prototype = []

[dependencies]
pyo3 = { version = "0.29.2", features = ["generate-import-lib"] }
parquet = "59.2.0"
arrow-array = "59.2.0"
arrow-buffer = "59.2.0"
arrow-cast = "59.2.0"
arrow-schema = "59.2.0"
arrow-csv = "59.2.0"
arrow-ipc = "59.2.0"
csv = "1.4.0"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
