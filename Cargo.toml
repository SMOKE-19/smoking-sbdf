[package]
name = "smoking-sbdf"
version = "0.1.3"
edition = "2021"
description = "Rust core for streaming CSV, Parquet, and DataFrame conversion to Spotfire SBDF"
license = "BSD-3-Clause"
readme = "README.md"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[features]
extension-module = ["pyo3/extension-module"]
planned-offset-prototype = []

[dependencies]
pyo3 = { version = "0.27.1", features = ["generate-import-lib"] }
parquet = "56.2.0"
arrow-array = "56.2.0"
arrow-cast = "56.2.0"
arrow-schema = "56.2.0"
arrow-csv = "56.2.0"
csv = "1.4.0"
memmap2 = "0.9"
