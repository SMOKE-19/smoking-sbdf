name: Manual wheel build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-wheel-build
  cancel-in-progress: true

jobs:
  quality:
    name: Rust format, lint, and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Lint Rust targets and features
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test Rust core and planned-offset path
        run: cargo test --features planned-offset-prototype

  build-linux:
    name: Linux wheel / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: quality
    env:
      RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/build/source
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --locked --out dist --interpreter python${{ matrix.python-version }}
          manylinux: auto

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

  build-windows:
    name: Windows wheel / Python ${{ matrix.python-version }}
    runs-on: windows-latest
    needs: quality
    env:
      RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/build/source
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --locked --out dist --interpreter python

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error
