name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag, version, and tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Verify package versions match the tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          python_version = tomllib.loads(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          rust_version = tomllib.loads(
              Path("Cargo.toml").read_text(encoding="utf-8")
          )["package"]["version"]
          expected_tag = f"v{python_version}"
          actual_tag = os.environ["RELEASE_TAG"]
          if rust_version != python_version:
              raise SystemExit(
                  f"Cargo.toml ({rust_version}) and pyproject.toml "
                  f"({python_version}) versions differ"
              )
          if actual_tag != expected_tag:
              raise SystemExit(
                  f"release tag {actual_tag!r} must equal {expected_tag!r}"
              )
          print(f"releasing smoking-sbdf {python_version}")
          PY

      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --features planned-offset-prototype

  build-linux:
    name: Linux wheel / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: verify
    env:
      RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/build/source
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --locked --out dist --interpreter python${{ matrix.python-version }}
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

  build-windows:
    name: Windows wheel / Python ${{ matrix.python-version }}
    runs-on: windows-latest
    needs: verify
    env:
      RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/build/source
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --locked --out dist --interpreter python
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

  build-sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-sdist]
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish immutable tagged release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
