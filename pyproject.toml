[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "smoking-sbdf"
version = "0.1.4"
description = "Rust-backed streaming conversion from CSV, Parquet, and DataFrames to Spotfire SBDF"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "THIRD_PARTY_LICENSES.txt",
]
keywords = ["sbdf", "spotfire", "parquet", "csv", "arrow"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Database :: Database Engines/Servers",
]
dependencies = []

[project.urls]
Repository = "https://github.com/SMOKE-19/smoking-sbdf"
Issues = "https://github.com/SMOKE-19/smoking-sbdf/issues"

[project.scripts]
smoking-sbdf = "smoking_sbdf.cli:main"

[tool.maturin]
python-source = "src"
module-name = "smoking_sbdf._native"
features = ["extension-module"]
strip = true
exclude = [
    { path = ".TODO/**", format = "sdist" },
    { path = ".github/**", format = "sdist" },
    { path = ".gitignore", format = "sdist" },
    { path = "docs/**", format = "sdist" },
    { path = "examples/**", format = "sdist" },
    { path = "tests/**", format = "sdist" },
    { path = "AGENTS.md", format = "sdist" },
    { path = "USAGE.md", format = "sdist" },
    { path = "build.md", format = "sdist" },
]
